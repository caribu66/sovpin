# SovPin — Kubo IPFS Node
# Deploy on the MacBook (192.168.86.110) via Tailscale (100.66.85.86)
#
# Prerequisites:
#   - Tailscale installed and connected on the MacBook
#   - Tailscale IP: 100.66.85.86
#   - SSH access: ssh -i ~/.ssh/vreal_mirror_ed25519 macbook@192.168.86.110
#   - 3.6 TB media drive mounted at /srv/media (bind-mounted for blocks only)
#
# Storage split:
#   - Kubo config, DB, keystore, datastore → SSD named volume (kubo-data)
#   - IPFS blockstore (pinned bytes) → HDD bind mount (/srv/media/kubo-blocks)
#
# Deploy: docker compose up -d
# Verify: curl -sI http://100.66.85.86:8080/ipfs/<cid>

services:
  kubo:
    image: ipfs/kubo:latest
    container_name: kubo
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      # Kubo config, DB, keystore, datastore → SSD (named volume)
      - "kubo-data:/data/ipfs"
      # IPFS blockstore (pinned bytes) → HDD (bind mount)
      - "/srv/media/kubo-blocks:/data/ipfs/blocks"
    ports:
      # Bound to Tailscale IP + MacBook LAN — NOT 0.0.0.0
      # (LAN bindings let the Chromebook reach Kubo; its Tailscale
      # runs in userspace-networking mode so TCP over 100.x fails.)
      - "100.66.85.86:4001:4001"
      - "100.66.85.86:4001:4001/udp"
      - "100.66.85.86:5001:5001"
      - "100.66.85.86:8080:8080"
      - "192.168.86.110:5001:5001"
      - "192.168.86.110:8080:8080"
    environment:
      - IPFS_PROFILE=server
    # Config is pre-baked in the named volume (from the original container).
    # The kubo image's start_ipfs entrypoint runs `ipfs daemon` by default.

volumes:
  kubo-data:
    external: true
    name: kubo-data
